name: Android USB APK

on:
  push:
    paths: ["Maui/**", ".github/workflows/android-usb.yml", "Makefile"]
  pull_request:
    paths: ["Maui/**", ".github/workflows/android-usb.yml", "Makefile"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Native build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y autoconf automake libtool-bin pkg-config
      - name: Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: Restore MAUI Android workload
        run: dotnet workload install maui-android
      - name: Portable parser checks
        run: dotnet run --project Maui/AppleNotes.Core.Tests --configuration Release
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: Maui/native/.build/android
          key: android-usb-native-${{ hashFiles('Maui/native/build.sh', 'Maui/native/patch_sources.py') }}
      - name: Build ARM64 sideload APK
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" make build
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: Maui/native/.build/android
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Verify native backend is packaged
        run: |
          APK="$(find Maui/AppleNotes.Android/bin/Release -name '*-Signed.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libnotesusb.so'
          mkdir -p artifacts
          cp "$APK" artifacts/NotesCableTransfer-arm64.apk
          sha256sum artifacts/NotesCableTransfer-arm64.apk > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: NotesCableTransfer-arm64
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-build-diagnostics
          path: Maui/native/.build/android/sources/**/config.log
          if-no-files-found: ignore
